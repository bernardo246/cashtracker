services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cash
      POSTGRES_PASSWORD: cash
      POSTGRES_DB: cash
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cash -d cash"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
