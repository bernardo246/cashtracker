name: Supabase keep-alive

# O Supabase Free pausa o projeto após 7 dias sem atividade. Este job faz um `SELECT 1`
# direto no banco (pelo pooler, sem passar pelo Render) uma vez por dia. O Render pode
# dormir à vontade: a primeira requisição só espera o cold start.
on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 09:17 UTC
  workflow_dispatch: # permite rodar manualmente em Actions → Run workflow

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SELECT 1 no Supabase
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_KEEPALIVE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret SUPABASE_KEEPALIVE_URL não configurado"
            exit 1
          fi
          psql "$DATABASE_URL" --no-psqlrc -v ON_ERROR_STOP=1 -tAc "select 1"
